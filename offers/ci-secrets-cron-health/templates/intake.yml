# 交付信息收集表 / Intake form
# 用法：复制本文件为客户副本填写；不要把填好的文件提交回公开仓库。
# 安全红线：本表只收集「位置与范围」，任何真实密钥、Token、密码、私钥一律不要填写。
# 若客户误填，请立即删除该行并轮换对应凭据。

schema_version: 1
offer: ci-secrets-cron-health

contact:
  name: "<客户联系人>"
  role: "<职位，如 后端负责人 / 运维>"
  email: "<工作邮箱>"
  timezone: "Asia/Shanghai"
  preferred_channel: "<邮件 / 即时通讯>"

scope:
  tier: "<A_self_service | B_light_audit | C_landing_support>"
  goal: "<一句话说明最想解决的问题>"
  deadline: "<期望交付日期，YYYY-MM-DD>"

repos:
  # 只写仓库地址与语言栈，不写任何凭据或 .env 内容
  - url: "<https://github.com/org/repo>"
    vcs: "<github | gitlab | gitea | 其他>"
    languages: ["<python>", "<shell>"]
    default_branch: "<main>"
    has_ci: "<yes | no | unknown>"
    ci_platform: "<github_actions | gitlab_ci | jenkins | none | unknown>"
    history_depth_ok: "<yes | no | unknown>"   # 是否允许扫描完整历史
    notes: "<特殊情况，如 大文件 / 子模块>"

hosts:
  # 只写主机角色与系统版本，不写 IP、账号、密码
  - role: "<应用服务器 / 备份机 / 跳板机>"
    os: "<Rocky Linux 10 / Ubuntu 24.04 / 其他>"
    scheduler: "<cron | systemd_timer | both | unknown>"
    unit_paths: ["/etc/systemd/system", "/etc/cron.d"]
    has_manifest: "<yes | no>"     # 是否已有期望清单可对账
    notes: "<是否存在容器内定时任务等>"

constraints:
  change_window: "<可执行变更的时间窗>"
  approval_required: "<yes | no>"
  forbidden_actions:
    - "不远程登录生产机"
    - "不代管密钥"
    - "不改写 Git 历史"
  data_handling: "<报告存放位置与保留期，如 交付后 30 天删除>"

declaration:
  no_secrets_included: true      # 提交前请确认：本文件不含任何真实凭据
  authorized_to_scan: true       # 确认对所列仓库/主机有审计授权
  signed_by: "<姓名>"
  signed_at: "<YYYY-MM-DD>"
